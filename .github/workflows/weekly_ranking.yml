name: Weekly Ranking + Full Site Update

on:
  schedule:
    # 每周六 20:00 台灣時間 = 12:00 UTC
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weekly:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests pandas numpy yfinance

    - name: Fetch weekly ranking data
      run: |
        python scripts/update_weekly.py

    - name: Run full site update (includes big holder TOP25)
      run: |
        python main.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "📅 Weekly update: $(date +'%Y-%m-%d') — ranking + full site + TOP25" || echo "No changes"
        git push
