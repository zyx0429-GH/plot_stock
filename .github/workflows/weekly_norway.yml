name: Weekly Norway Data Update

on:
  schedule:
    - cron: '0 5 * * 6'  # 每週六 05:00 UTC = 台灣 13:00 (01:00PM)
  workflow_dispatch:

# Note: No push trigger - deploy is handled by deploy.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-norway:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Step 1 - Fetch Norway data
      id: norway
      continue-on-error: true
      run: |
        echo "=== Step 1: Fetching Norway data ==="
        python scripts/norway_fetcher_v2.py || echo "[WARN] Norway fetch failed, using existing data"
        ls -la data/norway/ 2>/dev/null || echo "No norway data dir"

    - name: Step 2 - Validate Norway data
      id: validate
      run: |
        echo "=== Step 2: Validating Norway data ==="
        python scripts/validate_data.py || echo "Validation warnings (non-fatal)"

    - name: Step 3 - Fetch TWSE/TPEX data
      id: twse
      env:
        FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
      run: |
        echo "=== Step 3: Fetching TWSE/TPEX data ==="
        python scripts/data_fetcher.py
        echo "TWSE fetch exit code: $?"

    - name: Step 4 - Run screening
      id: screen
      run: |
        echo "=== Step 4: Running stock screening ==="
        python scripts/stock_screener.py
        echo "Screening exit code: $?"

    - name: Step 5 - Generate HTML pages
      id: generate
      run: |
        echo "=== Step 5: Generating HTML ==="
        python scripts/generate_html.py
        echo "HTML generation exit code: $?"
        python scripts/norway_to_weekly_json.py
        echo "Weekly JSON conversion exit code: $?"
        python scripts/generate_weekly_html.py
        echo "Weekly HTML generation exit code: $?"

    - name: Step 6 - Post-validation
      id: postvalidate
      run: |
        echo "=== Step 6: Post-validation ==="
        python scripts/validate_data.py || echo "[WARN] Validation warnings"

    - name: Step 7 - Commit and push
      id: commit
      run: |
        echo "=== Step 7: Commit and push ==="
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git config pull.rebase true
        git config rebase.autoStash true
        git add -A
        git status
        git commit -m "📊 Weekly Norway update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        git pull origin main || echo "Nothing to pull"
        git push

    - name: Step 8 - Setup Pages
      uses: actions/configure-pages@v5

    - name: Step 9 - Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

    - name: Step 10 - Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
