name: Daily Stock Update

on:
  schedule:
    - cron: '50 8 * * 1-5'  # 週一到週五 08:50 UTC = 台灣16:50 (04:50PM) 盤後數據更新
  workflow_dispatch:       # 允許手動觸發

# Note: push 事件不觸發此工作流，避免每次代碼推送時重新抓取數據
# 數據更新只在排程時間或手動觸發時執行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Step 1 - Fetch Norway big holder data (weekly, skip on failure)
      id: norway
      continue-on-error: true
      run: |
        echo "=== Step 1: Fetching Norway data (weekly update) ==="
        python scripts/norway_fetcher_v2.py || echo "[WARN] Norway fetch failed, using existing data from repo"
        echo "Norway data status:"
        ls -la data/norway/ 2>/dev/null || echo "  No norway data dir"
        ls -la data/*.json 2>/dev/null | head -5 || true

    - name: Step 2 - Fetch TWSE/TPEX data
      id: twse
      env:
        FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
      run: |
        echo "=== Step 2: Fetching TWSE/TPEX data ==="
        python scripts/data_fetcher.py
        echo "TWSE fetch exit code: $?"

    - name: Step 3 - Run screening
      id: screen
      run: |
        echo "=== Step 3: Running stock screening ==="
        python scripts/stock_screener.py
        echo "Screening exit code: $?"

    - name: Step 4 - Generate HTML pages
      id: generate
      run: |
        echo "=== Step 4: Generating HTML ==="
        python scripts/generate_html.py
        echo "HTML generation exit code: $?"
        python scripts/norway_to_weekly_json.py
        echo "Weekly JSON conversion exit code: $?"
        python scripts/generate_weekly_html.py
        echo "Weekly HTML generation exit code: $?"

    - name: Step 5 - Validate data integrity
      id: validate
      run: |
        echo "=== Step 5: Validating data ==="
        python scripts/validate_data.py || echo "[WARN] Validation warnings"

    - name: Step 6 - Commit and push changes
      id: commit
      run: |
        echo "=== Step 6: Commit and push ==="
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git config pull.rebase true
        git config rebase.autoStash true
        git add -A
        git status
        git commit -m "📊 Daily update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        git pull origin main || echo "Nothing to pull"
        git push

    - name: Step 7 - Setup Pages
      uses: actions/configure-pages@v5

    - name: Step 8 - Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

    - name: Step 9 - Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
