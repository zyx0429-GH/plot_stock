name: Daily Stock Update

on:
  push:
    branches: [main]
  schedule:
    - cron: '50 8 * * 1-5'  # 週一到週五 08:50 UTC = 台灣16:50 (04:50PM) 盤後數據更新
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Step 1 - Fetch Norway big holder data
      id: norway
      continue-on-error: true
      run: |
        echo "=== Step 1: Fetching Norway data ==="
        python scripts/norway_fetcher_v2.py || echo "[WARN] Norway fetch failed, using existing data"
        ls -la data/norway/ 2>/dev/null || echo "No norway data dir"
        ls -la data/*.json 2>/dev/null | head -5 || true

    - name: Step 2 - Pre-validation (check existing data)
      id: prevalidate
      run: |
        echo "=== Step 2: Pre-validation ==="
        python scripts/validate_data.py || echo "Pre-validation warnings (non-fatal)"

    - name: Step 3 - Fetch TWSE/TPEX data
      id: twse
      env:
        FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
      run: |
        echo "=== Step 3: Fetching TWSE/TPEX data ==="
        python -c "from scripts.data_fetcher import fetch_all; fetch_all()"
        echo "TWSE fetch exit code: $?"

    - name: Step 4 - Run screening
      id: screen
      run: |
        echo "=== Step 4: Running stock screening ==="
        python -c "from scripts.stock_screener import run_screening; run_screening()"
        echo "Screening exit code: $?"

    - name: Step 5 - Generate HTML pages
      id: generate
      run: |
        echo "=== Step 5: Generating HTML ==="
        python -c "from scripts.generate_html import generate; generate()"
        echo "HTML generation exit code: $?"
        python -c "from scripts.norway_to_weekly_json import convert; convert()"
        echo "Weekly JSON conversion exit code: $?"
        python -c "from scripts.generate_weekly_html import generate_weekly; generate_weekly()"
        echo "Weekly HTML generation exit code: $?"

    - name: Step 6 - Post-validation (check generated data)
      id: postvalidate
      run: |
        echo "=== Step 6: Post-validation ==="
        python scripts/validate_data.py
        if [ $? -ne 0 ]; then
          echo "[ERROR] Post-validation failed. Will not push broken data."
          echo "[DEBUG] Checking data files..."
          ls -la data/ || true
          cat data/screened_data.json | python -c "import json,sys; d=json.load(sys.stdin); print('screened:',len(d.get('screened',[]))); print('dual:',len(d.get('dual_certified',[]))); print('triple:',len(d.get('triple_certified',[])))" || true
          exit 1
        fi

    - name: Step 7 - Commit and push changes
      id: commit
      run: |
        echo "=== Step 7: Commit and push ==="
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git config pull.rebase true
        git config rebase.autoStash true
        git add -A
        git status
        git commit -m "📊 Daily update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        git pull origin main || echo "Nothing to pull"
        git push

    - name: Step 8 - Setup Pages
      uses: actions/configure-pages@v5

    - name: Step 9 - Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

    - name: Step 10 - Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
