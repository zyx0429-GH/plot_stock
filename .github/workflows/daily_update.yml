name: Daily Stock Update

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1-5'  # 週一到週五 早上7點 (UTC) = 台灣15:00盤後
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run full pipeline (fetch + screen + generate)
      env:
        FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
      run: |
        python main.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git config pull.rebase true
        git config rebase.autoStash true
        git add -A
        git commit -m "📊 Daily update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
        git pull origin main || echo "Nothing to pull"
        git push

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
